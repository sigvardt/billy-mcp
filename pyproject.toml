[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "billy-mcp"
version = "0.1.0"
description = "A safety-first FastMCP stdio server for Billy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Billy MCP contributors" }]
dependencies = [
  "fastmcp>=3.2,<4",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "pyotp>=2.9,<3",
]

[project.scripts]
billy-mcp = "billy_mcp.server:main"

[dependency-groups]
dev = [
  "pip-audit>=2.8,<3",
  "pyright>=1.1.390,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/billy_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
markers = [
  "live: requires the dedicated non-production Billy organisation",
  "vision: requires headless rendered-frame review by Grok",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".fractal"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = false
